name: INTERCON Stage 5 PisoWiFi Remote CS (DRAFT / NO-GO)

on:
  push:
    paths:
      - "Hardware/esp8266/BlazePisonetUniversal/staging/**"
      - "Hardware/tests/test_intercon_stage1_contract.py"
      - "Hardware/tests/test_intercon_pinout_ui.py"
      - "Hardware/tests/intercon_remote_cs_protocol_test.cpp"
      - "Hardware/tests/test_intercon_remote_cs_source.py"
      - "Hardware/tests/intercon_secure_wire_test.cpp"
      - "Hardware/tests/intercon_credit_ledger_test.cpp"
      - "Hardware/tests/intercon_journal_fault_test.cpp"
      - "Hardware/tests/intercon_stage4_end_to_end_test.cpp"
      - "Hardware/tests/intercon_arm_guard_test.cpp"
      - ".github/workflows/intercon-stage1-ci.yml"
  pull_request:
    paths:
      - "Hardware/esp8266/BlazePisonetUniversal/staging/**"
      - "Hardware/tests/test_intercon_stage1_contract.py"
      - "Hardware/tests/test_intercon_pinout_ui.py"
      - "Hardware/tests/intercon_remote_cs_protocol_test.cpp"
      - "Hardware/tests/test_intercon_remote_cs_source.py"
      - "Hardware/tests/intercon_secure_wire_test.cpp"
      - "Hardware/tests/intercon_credit_ledger_test.cpp"
      - "Hardware/tests/intercon_journal_fault_test.cpp"
      - "Hardware/tests/intercon_stage4_end_to_end_test.cpp"
      - "Hardware/tests/intercon_arm_guard_test.cpp"
      - ".github/workflows/intercon-stage1-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify non-production role, network, coin-gate invariants
        run: |
          python3 Hardware/tests/test_intercon_stage1_contract.py
          python3 Hardware/tests/test_intercon_pinout_ui.py
          python3 Hardware/tests/test_intercon_remote_cs_source.py

  signed-wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run portable HMAC-SHA256 parser tests with OpenSSL
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            Hardware/tests/intercon_secure_wire_test.cpp -lcrypto -o /tmp/intercon-secure-wire-tests
          /tmp/intercon-secure-wire-tests
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            Hardware/tests/intercon_credit_ledger_test.cpp -o /tmp/intercon-credit-ledger-tests
          /tmp/intercon-credit-ledger-tests
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            Hardware/tests/intercon_journal_fault_test.cpp -o /tmp/intercon-journal-fault-tests
          /tmp/intercon-journal-fault-tests
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            Hardware/tests/intercon_stage4_end_to_end_test.cpp -lcrypto -o /tmp/intercon-stage4-end-to-end
          /tmp/intercon-stage4-end-to-end
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            Hardware/tests/intercon_arm_guard_test.cpp -o /tmp/intercon-arm-guard-tests
          /tmp/intercon-arm-guard-tests
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            Hardware/tests/intercon_remote_cs_protocol_test.cpp -lcrypto -o /tmp/intercon-remote-cs-tests
          /tmp/intercon-remote-cs-tests

  compile-esp8266:
    runs-on: ubuntu-latest
    needs: [static-contract, signed-wire]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install pinned ESP8266 Arduino core and TM1637Display library
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266@3.1.2
          arduino-cli lib install "TM1637"
      - name: Compile INTERCON Stage 5 Remote CS sketch (source-only, no flashing)
        run: |
          arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 --warnings all \
            --output-dir /tmp/intercon-stage5-lab \
            Hardware/esp8266/BlazePisonetUniversal/staging/BlazePisonetIntercon
      - name: Publish compiled ESP8266 firmware for controlled LAB testing only
        uses: actions/upload-artifact@v4
        with:
          name: blaze-intercon-stage5-ESP8266-LAB-NO-GO
          path: /tmp/intercon-stage5-lab/*.bin
          if-no-files-found: error
          retention-days: 14

  source-package:
    name: Package complete Arduino IDE source (NO BIN)
    runs-on: ubuntu-latest
    needs: [compile-esp8266]
    steps:
      - uses: actions/checkout@v4
      - name: Assemble .ino, every local header, setup documentation, and controller transport source
        run: |
          set -euo pipefail
          sketch="Hardware/esp8266/BlazePisonetUniversal/staging/BlazePisonetIntercon"
          stage="Hardware/esp8266/BlazePisonetUniversal/staging"
          bundle="/tmp/blaze-stage5-source"
          mkdir -p "$bundle/BlazePisonetIntercon" "$bundle/Docs" "$bundle/Tools"
          cp "$sketch"/*.ino "$sketch"/*.h "$bundle/BlazePisonetIntercon/"
          cp "$stage/STAGE5_SOURCE_PACKAGE_README.md" "$bundle/README_START_HERE.md"
          cp "$stage/REMOTE_CS_PISOWIFI_STAGE5.md" "$bundle/Docs/"
          cp "$stage/REMOTE_CS_BLAZEPWIFI_BRIDGE_CONTRACT.md" "$bundle/Docs/"
          cp "$stage/V15_RECONCILIATION_STAGE4_2.md" "$bundle/Docs/"
          cp "Hardware/tools/remote_cs_client.py" "$bundle/Tools/"
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path("/tmp/blaze-stage5-source")
          d=p/"BlazePisonetIntercon"
          ino=list(d.glob("*.ino"))
          headers=list(d.glob("*.h"))
          assert len(ino)==1 and ino[0].stem==d.name, "Arduino sketch folder/filename mismatch"
          assert len(headers)==13, f"expected all 13 companion headers; found {len(headers)}"
          text=ino[0].read_text(encoding="utf-8")
          includes=re.findall(r'^\s*#include\s+"([^"]+)"',text,re.MULTILINE)
          assert includes and all((d/x).is_file() for x in includes), "missing local header dependency"
          assert (p/"README_START_HERE.md").is_file()
          assert len(list((p/"Docs").glob("*.md")))==3
          for f in p.rglob("*"):
              if f.is_file():
                  assert f.suffix.lower() not in (".bin",".elf",".hex",".o",".a",".map"), str(f)
          print("PASS: complete Stage 5 Arduino source, local includes, guides; NO BIN")
          PY
          (cd "$bundle" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
      - name: Upload ready-to-extract source ZIP (not a binary build)
        uses: actions/upload-artifact@v4
        with:
          name: BLAZE_INTERCON_STAGE5_FULL_ARDUINO_SOURCE_NO_BIN
          path: /tmp/blaze-stage5-source/
          if-no-files-found: error
          retention-days: 14
