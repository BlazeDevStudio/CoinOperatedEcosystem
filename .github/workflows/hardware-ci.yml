name: BlazeHardware & Shared Contracts CI

on:
  push:
    paths:
      - "Hardware/**"
      - "Shared/**"
      - "tools/**"
      - ".github/workflows/hardware-ci.yml"
  pull_request:
    paths:
      - "Hardware/**"
      - "Shared/**"
      - "tools/**"
      - ".github/workflows/hardware-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Firmware Hardening & Shared Contracts Validation (NO-GO)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate firmware hardening & syntax
        run: sh Hardware/tests/test_firmware_hardening.sh

      - name: Validate shared contracts & router profiles
        run: python3 -m unittest discover -s Shared/tests -p 'test_*.py' -v

      - name: Validate appliance firmware packaging & tools
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v

      - name: Validate all appliance profiles & firmware staging end-to-end
        run: python3 tools/validate_all_profiles.py

  esp8266:
    name: Compile ESP8266 Vendo Firmware (NO-GO)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@b3cda96fddef6af6c56b4c5efb5c47e2357935db # reviewed immutable Node24 action commit
        with:
          version: "1.6.0"

      - name: Install ESP8266 Core
        run: |
          set -eu
          version_output="$(arduino-cli version)"
          printf '%s\n' "$version_output"
          if ! printf '%s\n' "$version_output" | grep -Eq 'Version: 1\.6\.0([[:space:]]|$)'; then
            printf 'RELEASE-TOOLCHAIN-RED: expected Arduino CLI 1.6.0, got: %s\n' "$version_output" >&2
            exit 1
          fi
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266@3.1.2
          core_list="$(arduino-cli core list)"
          printf '%s\n' "$core_list"
          installed_version="$(printf '%s\n' "$core_list" | awk '$1 == "esp8266:esp8266" { print $2 }')"
          if [ "$installed_version" != "3.1.2" ]; then
            printf 'RELEASE-TOOLCHAIN-RED: expected ESP8266 core 3.1.2, got: %s\n' "$installed_version" >&2
            exit 1
          fi

      - name: Compile BlazePwifi Vendo ESP8266
        run: |
          mkdir -p Hardware/dist/esp8266
          arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 --output-dir Hardware/dist/esp8266 Hardware/esp8266/BlazePwifiVendo
          cp Hardware/esp8266/BlazePwifiVendo/BlazePwifiVendo.ino Hardware/dist/esp8266/

      - name: Write ESP8266 firmware artifact manifest and SHA256SUMS
        run: |
          set -eu
          source_sha="$(git rev-parse HEAD)"
          python3 tools/write_firmware_artifact_manifest.py \
            --artifact-dir Hardware/dist/esp8266 \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$source_sha" \
            --event-sha "$GITHUB_SHA" \
            --pr-head-sha "${{ github.event.pull_request.head.sha || '' }}" \
            --pr-base-sha "${{ github.event.pull_request.base.sha || '' }}" \
            --product BlazePwifiVendo \
            --board esp8266 \
            --fqbn esp8266:esp8266:nodemcuv2 \
            --arduino-cli-version 1.6.0 \
            --core-id esp8266:esp8266 \
            --core-version 3.1.2

      - name: Upload ESP8266 Firmware Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BlazeHardware-esp8266-firmware
          path: Hardware/dist/esp8266/

  esp32:
    name: Compile ESP32 Vendo Firmware (NO-GO)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@b3cda96fddef6af6c56b4c5efb5c47e2357935db # reviewed immutable Node24 action commit
        with:
          version: "1.6.0"

      - name: Install ESP32 Core
        run: |
          set -eu
          version_output="$(arduino-cli version)"
          printf '%s\n' "$version_output"
          if ! printf '%s\n' "$version_output" | grep -Eq 'Version: 1\.6\.0([[:space:]]|$)'; then
            printf 'RELEASE-TOOLCHAIN-RED: expected Arduino CLI 1.6.0, got: %s\n' "$version_output" >&2
            exit 1
          fi
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.13
          core_list="$(arduino-cli core list)"
          printf '%s\n' "$core_list"
          installed_version="$(printf '%s\n' "$core_list" | awk '$1 == "esp32:esp32" { print $2 }')"
          if [ "$installed_version" != "3.3.13" ]; then
            printf 'RELEASE-TOOLCHAIN-RED: expected ESP32 core 3.3.13, got: %s\n' "$installed_version" >&2
            exit 1
          fi

      - name: Compile BlazePwifi Vendo ESP32
        run: |
          mkdir -p Hardware/dist/esp32
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir Hardware/dist/esp32 Hardware/esp32/BlazePwifiVendo32
          cp Hardware/esp32/BlazePwifiVendo32/BlazePwifiVendo32.ino Hardware/dist/esp32/

      - name: Write ESP32 firmware artifact manifest and SHA256SUMS
        run: |
          set -eu
          source_sha="$(git rev-parse HEAD)"
          python3 tools/write_firmware_artifact_manifest.py \
            --artifact-dir Hardware/dist/esp32 \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "$source_sha" \
            --event-sha "$GITHUB_SHA" \
            --pr-head-sha "${{ github.event.pull_request.head.sha || '' }}" \
            --pr-base-sha "${{ github.event.pull_request.base.sha || '' }}" \
            --product BlazePwifiVendo32 \
            --board esp32 \
            --fqbn esp32:esp32:esp32 \
            --arduino-cli-version 1.6.0 \
            --core-id esp32:esp32 \
            --core-version 3.3.13

      - name: Upload ESP32 Firmware Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BlazeHardware-esp32-firmware
          path: Hardware/dist/esp32/
